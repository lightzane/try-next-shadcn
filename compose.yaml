# References:
# 1. https://nextjs.org/docs/app/getting-started/deploying#templates-1
# 2. https://github.com/vercel/next.js/blob/canary/examples/with-docker/compose.yml

services:
  # Node.js service (use with: docker compose up nextjs-standalone --build)
  nextjs-standalone:
    build:
      context: .
      dockerfile: Dockerfile
      network: host # fixes: docker compose build can't resolve fonts.googleapis.com during `next build`, unlike plain `docker build`
    image: nextjs-standalone-image
    container_name: nextjs-standalone-container
    environment:
      NODE_ENV: production
      PORT: '3000'
    ports:
      - '3000:3000'
    restart: unless-stopped

  # Bun service (use with: docker compose up nextjs-standalone-with-bun --build)
  nextjs-standalone-with-bun:
    build:
      context: .
      dockerfile: Dockerfile.bun
    image: nextjs-standalone-bun-image
    container_name: nextjs-standalone-bun-container
    environment:
      NODE_ENV: production
      PORT: '3000'
    ports:
      - '3000:3000'
    restart: unless-stopped
